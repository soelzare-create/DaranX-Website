# استقرار خودکار سایت DaranX روی هاست cPanel از طریق FTP/FTPS.
# Auto-deploy the static site to cPanel hosting over FTP/FTPS on every push.
#
# ── راه‌اندازی یک‌بار (One-time setup) ────────────────────────────────────────
# در GitHub: Settings → Secrets and variables → Actions → New repository secret
# سه Secret زیر را بسازید (نام‌ها باید دقیقاً همین باشند):
#   FTP_SERVER    → آدرس هاست، مثلاً ftp.daranx.com  (از Configure FTP Client)
#   FTP_USERNAME  → نام کاربری FTP، مثلاً deploy@daranx.com
#   FTP_PASSWORD  → رمز همان حساب FTP
# رمز فقط اینجا ذخیره می‌شود، در کد یا لاگ‌ها دیده نمی‌شود.
# ─────────────────────────────────────────────────────────────────────────────

name: deploy-to-cpanel

# ✅ فعال: با هر push روی main، سایت خودکار روی هاست cPanel از طریق FTPS منتشر می‌شود.
on:
  push:
    branches: ["main"]
  workflow_dispatch:        # اجرای دستی از تب Actions همچنان ممکن است

# The job only reads the repo; the token gets no write access.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Report whether the FTP server's certificate is valid for the FTP_SERVER
      # name. Once it is, "security: loose" below can become "strict" so the
      # FTP password cannot be intercepted by a man-in-the-middle.
      - name: Check the FTP server's TLS certificate
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" -servername "$FTP_SERVER" \
               -verify_hostname "$FTP_SERVER" -verify_return_error </dev/null >tls.txt 2>&1; then ok=yes; else ok=no; fi
          echo "certificate valid for the FTP_SERVER name: $ok"
          grep -E 'Verify return code|verify error' tls.txt | head -3 || true
          timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName 2>/dev/null | sed 's/^/    /' || true
          rm -f tls.txt

      # Third-party action pinned to a commit, so a moved tag cannot change what runs with the FTP password.
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # اتصال امن. اگر هاست FTPS نداشت، این خط را به ftp تغییر دهید.
          protocol: ftps
          # گواهی FTPS در هاست‌های اشتراکی معمولاً self-signed است.
          security: loose
          port: 21

          # پوشهٔ مقصد روی هاست.
          #  • حساب FTP اختصاصی با Directory=public_html  →  "./"
          #  • حساب اصلی cPanel                           →  "public_html/"
          server-dir: ./

          # فقط فایل‌های تغییرکرده آپلود می‌شوند (وضعیت روی هاست نگه داشته می‌شود).
          # این فایل‌ها هرگز روی سایت منتشر نمی‌شوند:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            .gitignore
            # The PHP invoice app has its own workflow (deploy-invoice.yml,
            # lftp with retries): its large file batch trips this shared
            # host's FTP session here, so it is excluded from this deploy.
            invoice/**

      # بعد از آپلود: صفحهٔ زندهٔ سایت را می‌خوانیم و گزارش می‌دهیم که تغییرات
      # واقعاً سرو می‌شوند یا نه (و آیا یک CDN/کش نسخهٔ قدیمی را نگه داشته).
      - name: Check the live site
        continue-on-error: true
        run: |
          for u in "https://www.daranx.com/" "https://www.daranx.com/cctv.html"; do
            code=$(curl -s -o page.html -D head.txt -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "$u") || code=000
            if grep -q "behsarmaholding.com" page.html 2>/dev/null; then hold=yes; else hold=no; fi
            if grep -q 'class="foot-parent"' page.html 2>/dev/null; then fp=yes; else fp=no; fi
            echo "$u -> HTTP $code | holding link: $hold | footer box: $fp"
            grep -iE '^(server|cf-cache-status|age|cache-control|x-cache|last-modified|strict-transport-security|x-frame-options|referrer-policy):' head.txt | sed 's/^/    /' || true
            rm -f page.html head.txt
          done
          # Every other spelling of the address must 301 to https://www.daranx.com
          for u in "http://daranx.com/" "http://www.daranx.com/" "https://daranx.com/cctv.html"; do
            r=$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' --max-time 20 "$u") || r="000"
            echo "$u -> $r"
          done
